log_level: INFO
service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: null
  enable_cors: false
storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  temp_path: /qdrant/tmp
  on_disk_payload: true
  update_concurrency: 1
  wal:
    wal_capacity_mb: 4
    wal_segments_ahead: 0
  performance:
    max_search_threads: 1
    max_optimization_threads: 1
  optimizers:
    deleted_threshold: 0.2
    vacuum_min_vector_number: 1000
    default_segment_number: 1
    max_segment_size_kb: 200000
    memmap_threshold_kb: 10000
    indexing_threshold_kb: 2000000
    flush_interval_sec: 5
  hnsw_index:
    m: 8
    ef_construct: 32
    full_scan_threshold_kb: 1000
    max_indexing_threads: 1
    on_disk: true
  low_memory_mode: no_populate
